name: CI

# master, not main. Every remote this repository has - GitHub, git1 and git2 -
# reports `master` as HEAD, and none of them carries a `main` at all. This said
# `main` from E18a until now, which means the workflow never fired once:
# `on: push: branches:` matches a branch *name*, and a name that does not exist
# matches nothing. Nothing reports that. The Actions tab stays empty and the
# badge added in E18b reads "no status", which looks like "has not run yet"
# rather than "cannot run" - so the one thing that would have shown the mistake
# reads as if there were none. Hermod and Styx both say `master`; this was the
# outlier.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Manual runs from the Actions tab ("Run workflow"), as in the conformance
  # suites. It is also the cheapest way to see a change to this file take
  # effect without pushing a commit to find out.
  workflow_dispatch:

# A newer push supersedes an in-flight run for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # windows-latest, like Hermod and Styx. Here the reason is inherited rather
    # than our own: Ratatoskr itself looks platform-neutral, but it builds
    # Hermod, and that one pulls in System.Diagnostics.PerformanceCounter,
    # System.IO.Ports and System.Drawing.Common. Linux would be cheaper and is
    # worth a second matrix entry - but not before someone has seen it pass.
    runs-on: windows-latest
    steps:
      # Three checkouts side by side, because this repository cannot be built
      # on its own. Ratatoskr.csproj and RatatoskrTests.csproj reference
      # ..\..\Hermod\Hermod\Hermod.csproj - a SIBLING directory - and Hermod in
      # turn references ..\..\Styx\... the same way. There are no submodules for
      # either, so the layout the relative paths assume has to be reproduced by
      # hand:
      #
      #   Ratatoskr/   Hermod/   Styx/
      #
      # Note what this does not do: pin either of them. We build against Hermod
      # master and Styx master, so a breaking change over there turns this red
      # without anything in Ratatoskr having moved. That is the honest signal,
      # but it is a choice - the superproject (XMPPConformanceTests) pins all
      # three submodules and is where a reproducible build lives.
      - uses: actions/checkout@v4
        with:
          path: Ratatoskr

      - uses: actions/checkout@v4
        with:
          repository: Vanaheimr/Hermod
          path: Hermod

      - uses: actions/checkout@v4
        with:
          repository: Vanaheimr/Styx
          path: Styx

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        working-directory: Ratatoskr
        run: dotnet build RatatoskrTests/RatatoskrTests.csproj --configuration Release

      # This suite tests the library against itself, and that is the whole
      # point of E19: everything that needs a foreign implementation - Prosody,
      # ejabberd, python-omemo - moved to the XMPPConformanceTests repository,
      # where the setups that produce those far sides have always lived. So a
      # hosted runner can execute all of it.
      #
      # Expect 1110 passed, 1 skipped. The one is a test for a property that
      # exists only in STARTTLS operation; it is the only environment-dependent
      # test left here. Read anything above that as a question, not as noise:
      # the number of skipped tests is the only thing that tells a run which
      # measured something from one which measured nothing, and this project
      # has been caught by that twice (D54, D97).
      - name: Test
        timeout-minutes: 30
        working-directory: Ratatoskr
        run: dotnet test RatatoskrTests/RatatoskrTests.csproj --configuration Release --no-build --logger "console;verbosity=normal"
